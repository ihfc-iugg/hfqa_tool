version: '1.0'
schema_id: heatflow:v1
name: heat_flow_db_complete
normalization:
  string:
    trim: true
    collapse_space: true
    case_insensitive: true
    enforce_brackets: true
    normalize_separator: true
    missing_tokens:
    - ''
    - NA
    - <NA>
    - none
    - 'null'
  numeric:
    decimal_comma_to_dot: true
    strip_thousands_separators:
    - ' '
    missing_tokens:
    - ''
    - NA
    - <NA>
core:
  ID:
    dtype: int64
    unique: true
    min: 1
  Obligation:
    dtype: string
    allowed:
    - o
    - '-'
    - m
    - r
  Level:
    dtype: string
    allowed:
    - child
    - admin
    - parent
columns:
  P1:
    dtype: float64
    range:
    - -999999.9
    - 999999.9
    obligation: M
    comment: HF Value
  P2:
    dtype: float64
    range:
    - 0.0
    - 999999.9
    obligation: M
    comment: HF Uncertainty
  P3:
    dtype: string
    obligation: M
    comment: Name
  P4:
    dtype: float64
    range:
    - -90.0
    - 90.0
    obligation: M
    comment: Latitude
  P5:
    dtype: float64
    range:
    - -180.0
    - 180.0
    obligation: M
    comment: Longitude
  P6:
    dtype: float64
    range:
    - -12000.0
    - 9000.0
    obligation: M
    comment: Elevation
  P7:
    dtype: list[string]
    allowed:
    - '[unspecified]'
    - '[offshore-(marine)]'
    - '[other-(specify-in-comments)]'
    - '[onshore-(lake-river-etc.)]'
    - '[onshore-(continental)]'
    - '[offshore-(continental)]'
    obligation: M
    multi_choice: true
    separator: ;
    comment: Location Type (multi-select)
  P8:
    dtype: string
    obligation: R
    comment: Comments (Parent level)
  P9:
    dtype: string
    allowed:
    - '[unspecified]'
    - '[yes]'
    - '[no]'
    obligation: R
    comment: Correction HP
  P10:
    dtype: float64
    range:
    - -12000.0
    - 9000.0
    obligation: R
    comment: Total MD
  P11:
    dtype: float64
    range:
    - -12000.0
    - 9000.0
    obligation: R
    comment: TVD
  P12:
    dtype: list[string]
    allowed:
    - '[unspecified]'
    - '[tunneling]'
    - '[drilling]'
    - '[probing-clustering]'
    - '[other-(specify-in-comments)]'
    - '[indirect-(gtm-bsr-cpd-etc.)]'
    - '[probing-(onshore-lake-river-etc.)]'
    - '[mining]'
    - '[probing-(offshore-ocean)]'
    - '[drilling-clustering]'
    obligation: M
    multi_choice: true
    separator: ;
    comment: Type of Exploration Method (multi-select)
  P13:
    dtype: list[string]
    allowed:
    - '[research]'
    - '[geothermal]'
    - '[groundwater]'
    - '[unspecified]'
    - '[hydrocarbon]'
    - '[tunneling]'
    - '[other-(specify-in-comments)]'
    - '[mapping]'
    - '[mining]'
    - '[underground-storage]'
    obligation: R
    multi_choice: true
    separator: ;
    comment: Exploration Purpose (multi-select)
  C1:
    dtype: float64
    range:
    - -999999.9
    - 999999.9
    obligation: M
    comment: HF Value (Child level)
  C2:
    dtype: float64
    range:
    - 0.0
    - 999999.9
    obligation: R
    comment: HF Uncertainty (Child level)
  C3:
    dtype: list[string]
    allowed:
    - '[interval-method]'
    - '[unspecified]'
    - '[other-numerical-computations]'
    - '[other-(specify-in-comments)]'
    - '[boot-strapping-method]'
    - '[bullard-method]'
    obligation: M
    multi_choice: true
    separator: ;
    comment: HF Method (multi-select)
  C4:
    dtype: float64
    range:
    - 0.0
    - 19999.9
    obligation: M
    comment: HF Interval Top
  C5:
    dtype: float64
    range:
    - 0.0
    - 19999.9
    obligation: M
    comment: HF Interval Bottom
  C6:
    dtype: float64
    range:
    - 0.0
    - 999.9
    obligation: R
    comment: Penetration Depth
  C7:
    dtype: string
    obligation: M
    comment: Primary publication reference
  C8:
    dtype: list[string]
    obligation: R
    multi_choice: true
    separator: ;
    comment: Primary reference (multi-entry)
  C9:
    dtype: string
    allowed:
    - '[yes]'
    - '[no]'
    obligation: M
    comment: Relevant Child
  C10:
    dtype: list[string]
    obligation: R
    multi_choice: true
    separator: ;
    comment: Comments (Child level; multi-entry)
  C11:
    dtype: string
    allowed:
    - '[considered-t]'
    - '[unspecified]'
    - '[not-considered]'
    - '[considered-pt]'
    - '[considered-p]'
    obligation: M
    multi_choice: true
    separator: ;
    comment: 'Flag: situ thermal properties considered (p, T, pT)'
  C12:
    dtype: string
    allowed:
    - '[drift-corrected]'
    - '[unspecified]'
    - '[tilt-corrected]'
    - '[not-corrected]'
    - '[corrected-(specify-in-comments)]'
    obligation: M
    multi_choice: true
    separator: ;
    comment: 'Flag: temperature corrections'
  C13:
    dtype: string
    allowed:
    - '[unspecified]'
    - '[present-and-not-corrected]'
    - '[present-not-significant]'
    - '[present-and-corrected]'
    - '[not-recognized]'
    obligation: M
    comment: 'Flag: sedimentation corrections'
