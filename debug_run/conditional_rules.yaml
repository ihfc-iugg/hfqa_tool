normalization:
  string:
    trim: true
    collapse_space: true
    case_insensitive: true
    enforce_brackets: true
    normalize_separator: true
    missing_tokens:
    - ''
    - NA
    - <NA>
    - none
    - 'null'
  numeric:
    decimal_comma_to_dot: true
    strip_thousands_separators:
    - ' '
    missing_tokens:
    - ''
    - NA
    - <NA>
conditional_rules:
- name: p12_indirect_method_c31
  kind: allowed_subset
  when:
    column: P12
    mode: contains
    value: '[Indirect (GTM-BSR-CPD-etc.)]'
  target:
    column: C31
    multi_choice: true
    separator: ;
    allowed:
    - '[SUR]'
    - '[CPD]'
    - '[XEN]'
    - '[GTM]'
    - '[unspecified]'
    - '[Other (specify in comments)]'
- name: p12_indirect_method_c32
  kind: allowed_subset
  when:
    column: P12
    mode: contains
    value: '[Indirect (GTM-BSR-CPD-etc.)]'
  target:
    column: C32
    multi_choice: true
    separator: ;
    allowed:
    - '[CPD]'
    - '[XEN]'
    - '[GTM]'
    - '[unspecified]'
    - '[Other (specify in comments)]'
- name: c11_considered_p_c45
  kind: allowed_subset
  when:
    column: C11
    mode: equals
    value: '[Considered - p]'
  target:
    column: C45
    multi_choice: true
    separator: ;
    allowed:
    - '[Replicated in-situ (p)]'
    - '[Corrected in-situ (p)]'
    - '[Site-specific experimental relationships]'
    - '[Other (specify in comments)]'
- name: c11_considered_t_c45
  kind: allowed_subset
  when:
    column: C11
    mode: equals
    value: '[Considered - T]'
  target:
    column: C45
    multi_choice: true
    separator: ;
    allowed:
    - '[Replicated in-situ (T)]'
    - '[Corrected in-situ (T)]'
    - '[Site-specific experimental relationships]'
    - '[Other (specify in comments)]'
- name: c11_considered_pt_c45
  kind: allowed_subset
  when:
    column: C11
    mode: equals
    value: '[Considered - pT]'
  target:
    column: C45
    multi_choice: true
    separator: ;
    allowed:
    - '[Actual in-situ (pT) conditions]'
    - '[Replicated in-situ (pT)]'
    - '[Corrected in-situ (pT)]'
    - '[Site-specific experimental relationships]'
    - '[Other (specify in comments)]'
- name: c11_not_considered_c45
  kind: allowed_subset
  when:
    column: C11
    mode: equals
    value: '[Not considered]'
  target:
    column: C45
    multi_choice: true
    separator: ;
    allowed:
    - '[Unrecorded ambient pT conditions]'
    - '[Recorded ambient pT conditions]'
- name: c11_unspecified_c45
  kind: allowed_subset
  when:
    column: C11
    mode: equals
    value: '[unspecified]'
  target:
    column: C45
    multi_choice: true
    separator: ;
    allowed:
    - '[unspecified]'
- name: c45_corr_p_restricts_c46_p_functions
  kind: allowed_subset
  when:
    column: C45
    mode: contains
    value: '[Corrected in-situ (p)]'
  target:
