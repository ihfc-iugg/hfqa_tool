version: "1.0"
schema_id: "heatflow:v1"
name: "heat_flow_db_complete"

# NORMALIZATION
normalization:
  string:
    trim: true               # remove leading/trailing whitespace
    collapse_space: true     # collapse multiple spaces into one
    case_insensitive: true   # treat values case-insensitively
    enforce_brackets: true   # ensure allowed vocab entries keep square brackets
    normalize_separator: true # replace ',' with ';' in multi-entry fields
    missing_tokens:           # interpret as NaN
      - ""
      - "NA"
      - "<NA>"
      - "none"
      - "null"

  numeric:
    decimal_comma_to_dot: true     # "123,45" -> "123.45"
    strip_thousands_separators:    # "1 234.56" -> "1234.56"
      - " "
    missing_tokens:
      - ""
      - "NA"
      - "<NA>"


core:
  ID:
    dtype: int64
    unique: true
    min: 1
  Obligation:
    dtype: string
    allowed: ["M", "R", "O", "-"]
  Level:
    dtype: string
    allowed: ["Parent", "Child", "Admin"]


columns:
  # ===== PARENT LEVEL (Pxx) =====
  P1:
    dtype: float64
    range: [-999999.9, 999999.9]
    obligation: "M"
    comment: "HF Value"

  P2:
    dtype: float64
    range: [0.0, 999999.9]
    obligation: "M"
    comment: "HF Uncertainty"

  P3:
    dtype: string
    obligation: "M"
    comment: "Name"


  P4:
    dtype: float64
    range: [-90.0, 90.0]
    obligation: "M"
    comment: "Latitude"

  P5:
    dtype: float64
    range: [-180.0, 180.0]
    obligation: "M"
    comment: "Longitude"

  P6:
    dtype: float64
    range: [-12000.0, 9000.0]
    obligation: "M"
    comment: "Elevation"

  P7:
    dtype: list[string]
    allowed:
      - "[Onshore (continental)]"
      - "[Onshore (lake-river-etc.)]"
      - "[Offshore (continental)]"
      - "[Offshore (marine)]"
      - "[Other (specify in comments)]"
      - "[unspecified]"
    obligation: "M"
    multi_choice: true
    separator: ";"
    comment: "Location Type (multi-select)"

  P8:
    dtype: string
    obligation: "R"
    comment: "Comments (Parent level)"

  P9:
    dtype: string
    allowed: ["[Yes]", "[No]", "[unspecified]"]
    obligation: "R"
    comment: "Correction HP"

  P10:
    dtype: float64
    range: [-12000.0, 9000.0]
    obligation: "R"
    comment: "Total MD"

  P11:
    dtype: float64
    range: [-12000.0, 9000.0]
    obligation: "R"
    comment: "TVD"

  P12:
    dtype: list[string]
    allowed:
      - "[Drilling]"
      - "[Mining]"
      - "[Tunneling]"
      - "[Probing (onshore-lake-river-etc.)]"
      - "[Probing (onshore/lake, river, etc.)]" # in old versions
      - "[Probing (offshore-ocean)]"
      - "[Drilling-Clustering]"
      - "[Probing-Clustering]"
      - "[Indirect (GTM-BSR-CPD-etc.)]"
      - "[Other (specify in comments)]"
      - "[unspecified]"
    obligation: "M"
    multi_choice: true
    separator: ";"
    comment: "Type of Exploration Method (multi-select)"

  P13:
    dtype: list[string]
    allowed:
      - "[Hydrocarbon]"
      - "[Underground storage]"
      - "[Geothermal]"
      - "[Groundwater]"
      - "[Mapping]"
      - "[Research]"
      - "[Mining]"
      - "[Tunneling]"
      - "[Other (specify in comments)]"
      - "[unspecified]"
    obligation: "R"
    multi_choice: true
    separator: ";"
    comment: "Exploration Purpose (multi-select)"

  
    # ===== CHILD LEVEL (Cxx) =====
  C1:
    dtype: float64
    range: [-999999.9, 999999.9]
    obligation: "M"
    comment: "HF Value (Child level)"

  C2:
    dtype: float64
    range: [0.0, 999999.9]
    obligation: "R"
    comment: "HF Uncertainty (Child level)"

  C3:
    dtype: list[string]
    allowed:
      - "[Interval method]"
      - "[Bullard method]"
      - "[Boot-strapping method]"
      - "[Other numerical computations]"
      - "[Other (specify in comments)]"
      - "[unspecified]"
    obligation: "M"
    multi_choice: true
    separator: ";"
    comment: "HF Method (multi-select)"

  C4:
    dtype: float64
    range: [0.0, 19999.9]
    obligation: "R" # relevant because for marine it is not mandatory , for borehole it is mandatory
    comment: "HF Interval Top"

  C5:
    dtype: float64
    range: [0.0, 19999.9]
    obligation: "R" # relevant because for marine it is not mandatory , for borehole it is mandatory
    comment: "HF Interval Bottom"

  C6:
    dtype: float64
    range: [0.0, 999.9]
    obligation: "R"
    comment: "Penetration Depth" # same  procedure as for tilt (C23); only check mandatory if probing 

  C7:
    dtype: string
    obligation: "M"
    comment: "Primary publication reference"

  C8:
    dtype: list[string]
    obligation: "R"
    multi_choice: true
    separator: ";"
    comment: "Primary reference (multi-entry)"
    
  C9:
    dtype: string
    allowed:
      - "[Yes]"
      - "[No]"
    obligation: "M"
    comment: "Relevant Child"

  C10:
    dtype: list[string]
    obligation: "R"
    multi_choice: true
    separator: ";"
    comment: "Comments (Child level; multi-entry)"

  C11:
    dtype: string
    allowed:
      - "[Considered - p]"
      - "[Considered - T]"
      - "[Considered - pT]"
      - "[Not considered]"
      - "[unspecified]"
    obligation: "M"
    multi_choice: true
    separator : ";"
    comment: "Flag: situ thermal properties considered (p, T, pT)"

  C12:
    dtype: string
    allowed:
      - "[Tilt corrected]"
      - "[Drift corrected]"
      - "[Not corrected]"
      - "[Corrected (specify in comments)]"
      - "[unspecified]"
    obligation: "M"
    multi_choice: true
    separator : ";"
    comment: "Flag: temperature corrections"

  C13:
    dtype: string
    allowed:
      - "[Present and corrected]"
      - "[Present and not corrected]"
      - "[Present not significant]"
      - "[Not recognized]"
      - "[unspecified]"
    obligation: "M"
    comment: "Flag: sedimentation corrections"

  C14:
    dtype: string
    allowed:
      - "[Present and corrected]"
      - "[Present and not corrected]"
      - "[Present not significant]"
      - "[Not recognized]"
      - "[unspecified]"
    obligation: "M"
    comment: "Flag: erosion corrections"

  C15:
    dtype: string
    allowed:
      - "[Present and corrected]"
      - "[Present and not corrected]"
      - "[Present not significant]"
      - "[Not recognized]"
      - "[unspecified]"
    obligation: "M"
    comment: "Flag: topographic corrections"

  C16:
    dtype: string
    allowed:
      - "[Present and corrected]"
      - "[Present and not corrected]"
      - "[Present not significant]"
      - "[Not recognized]"
      - "[unspecified]"
    obligation: "M"
    comment: "Flag: paleoclimatic corrections"

  C17:
    dtype: string
    allowed:
      - "[Present and corrected]"
      - "[Present and not corrected]"
      - "[Present not significant]"
      - "[Not recognized]"
      - "[unspecified]"
    obligation: "M"
